<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>InvestTrack — Personal Investment Tracker</title>
<style>
:root{--bg:#f5f7fb;--panel:#fff;--text:#172033;--muted:#687386;--line:#e6e9ef;--accent:#5b5ce2;--accent2:#7c3aed;--green:#0f9d6e;--red:#dc4c64;--shadow:0 12px 35px rgba(22,28,45,.08)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}
.app{display:flex;min-height:100vh}.side{width:245px;background:#111827;color:#fff;padding:24px 16px;position:sticky;top:0;height:100vh}.brand{font-size:21px;font-weight:800;padding:4px 10px 28px}.brand span{color:#8b8cf7}.nav button{display:block;width:100%;border:0;background:transparent;color:#aeb7c8;text-align:left;padding:12px 13px;border-radius:10px;margin:4px 0;cursor:pointer;font-size:14px}.nav button.active,.nav button:hover{background:#252b3b;color:#fff}.side-foot{position:absolute;bottom:20px;left:20px;right:20px;color:#7f8aa0;font-size:11px;line-height:1.5}
.main{flex:1;min-width:0}.top{padding:28px 34px 10px;display:flex;justify-content:space-between;align-items:center;gap:16px}.title h1{font-size:27px;margin:0 0 5px}.title p{margin:0;color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--panel);padding:9px 13px;border-radius:9px;font-weight:700;color:var(--text);cursor:pointer}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.content{padding:18px 34px 40px;max-width:1450px}.view{display:none}.view.active{display:block}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}.label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:800}.value{font-size:25px;font-weight:800;margin-top:7px}.sub{font-size:12px;color:var(--muted);margin-top:4px}.green{color:var(--green)}.red{color:var(--red)}.grid2{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.section-title{font-size:15px;font-weight:800;margin-bottom:14px}.barrow{margin:12px 0}.barlabel{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px}.bar{height:7px;background:#edf0f5;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:20px}.form{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.field label{display:block;font-size:11px;font-weight:800;color:var(--muted);margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--text);outline:none}.field textarea{resize:vertical}.full{grid-column:1/-1}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:12px}.table th{text-transform:uppercase;font-size:10px;color:var(--muted);text-align:left;padding:9px;border-bottom:1px solid var(--line)}.table td{padding:11px 9px;border-bottom:1px solid var(--line);white-space:nowrap}.empty{padding:25px;text-align:center;color:var(--muted);font-size:13px}.statement-head{display:flex;justify-content:space-between;gap:12px;align-items:end;margin-bottom:16px}.select{padding:10px;border:1px solid var(--line);border-radius:9px;background:#fff}.pill{display:inline-block;padding:4px 7px;border-radius:20px;background:#f0efff;color:#5555c7;font-size:10px;font-weight:800}.mobile-nav{display:none}
@media(max-width:900px){.side{display:none}.mobile-nav{display:flex;overflow:auto;background:#111827;padding:8px;gap:5px}.mobile-nav button{background:transparent;border:0;color:#aeb7c8;padding:10px 12px;white-space:nowrap;border-radius:8px}.mobile-nav button.active{background:#252b3b;color:#fff}.top,.content{padding-left:18px;padding-right:18px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}.form{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.cards{grid-template-columns:1fr}.form{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.statement-head{align-items:stretch;flex-direction:column}.value{font-size:22px}}
</style>
</head>
<body>
<div class="app">
<aside class="side"><div class="brand">Invest<span>Track</span></div><nav class="nav" id="sideNav"></nav><div class="side-foot">Personal portfolio tracker<br>Data stays in your browser.</div></aside>
<div class="main">
<div class="mobile-nav" id="mobileNav"></div>
<header class="top"><div class="title"><h1 id="pageTitle">Dashboard</h1><p>Track investments, investors and weekly performance in one place.</p></div><div class="actions"><button class="btn" id="export">Export backup</button><button class="btn" id="import">Import</button><input type="file" id="file" accept=".json" hidden></div></header>
<main class="content">
<section class="view active" id="dashboard"></section>
<section class="view" id="investment"></section>
<section class="view" id="holdings"></section>
<section class="view" id="weekly"></section>
<section class="view" id="statements"></section>
<section class="view" id="investors"></section>
</main>
</div></div>
<script>
const KEY='investtrack-v1';
let data=JSON.parse(localStorage.getItem(KEY)||'null')||{investors:['Me','Investor 2','Investor 3','Investor 4'],tx:[],weeks:[]};
let current='dashboard';
const money=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:2}).format(Number(n)||0);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const save=()=>localStorage.setItem(KEY,JSON.stringify(data));
const today=()=>new Date().toISOString().slice(0,10);
const investorOpts=()=>data.investors.map(x=>`<option>${esc(x)}</option>`).join('');
const stats=inv=>{let tx=inv?data.tx.filter(x=>x.investor===inv):data.tx;let buys=tx.filter(x=>x.type==='BUY');let invested=buys.reduce((a,x)=>a+x.amount,0);let value=tx.filter(x=>x.type==='BUY').reduce((a,x)=>a+x.qty*x.current,0);let realized=tx.filter(x=>x.type==='SELL').reduce((a,x)=>a+x.pl,0);let div=data.weeks.filter(x=>(!inv||x.investor===inv)&&x.activity==='Dividend received').reduce((a,x)=>a+x.pl,0);return{tx,invested,value,realized,pl:value-invested+realized+div}};
const nav=[['dashboard','Dashboard'],['investment','New Investment'],['holdings','Holdings'],['weekly','Weekly Log'],['statements','Investor Statements'],['investors','Investors']];
function buildNav(){let h=nav.map(([id,n])=>`<button class="${current===id?'active':''}" data-nav="${id}">${n}</button>`).join('');sideNav.innerHTML=h;mobileNav.innerHTML=h;document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>show(b.dataset.nav))}
function show(id){current=id;document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(id).classList.add('active');pageTitle.textContent=nav.find(x=>x[0]===id)[1];buildNav();render()}
function render(){renderDashboard();renderInvestment();renderHoldings();renderWeekly();renderStatements();renderInvestors();buildNav()}
function renderDashboard(){let s=stats();let pct=s.invested?s.pl/s.invested*100:0;let by={};data.investors.forEach(i=>by[i]=0);data.tx.filter(x=>x.type==='BUY').forEach(x=>by[x.investor]+=x.amount);let max=Math.max(1,...Object.values(by));let stocks={};data.tx.filter(x=>x.type==='BUY').forEach(x=>stocks[x.stock]=(stocks[x.stock]||0)+x.amount);let ss=Object.entries(stocks).sort((a,b)=>b[1]-a[1]).slice(0,7),sm=Math.max(1,...ss.map(x=>x[1]));dashboard.innerHTML=`<div class="cards"><div class="card"><div class="label">Total invested</div><div class="value">${money(s.invested)}</div></div><div class="card"><div class="label">Current value</div><div class="value">${money(s.value)}</div></div><div class="card"><div class="label">Overall P/L</div><div class="value ${s.pl>=0?'green':'red'}">${money(s.pl)}</div><div class="sub">${pct.toFixed(2)}% return</div></div><div class="card"><div class="label">Transactions</div><div class="value">${s.tx.length}</div></div></div><div class="grid2"><div class="card"><div class="section-title">Investor allocation</div>${Object.entries(by).map(([k,v])=>`<div class="barrow"><div class="barlabel"><span>${esc(k)}</span><b>${money(v)}</b></div><div class="bar"><i style="width:${v/max*100}%"></i></div></div>`).join('')||'<div class="empty">No investors yet.</div>'}</div><div class="card"><div class="section-title">Top holdings by invested amount</div>${ss.map(([k,v])=>`<div class="barrow"><div class="barlabel"><span>${esc(k)}</span><b>${money(v)}</b></div><div class="bar"><i style="width:${v/sm*100}%"></i></div></div>`).join('')||'<div class="empty">Add your first investment.</div>'}</div></div>`}
function renderInvestment(){investment.innerHTML=`<div class="card"><div class="section-title">Record a new transaction</div><form class="form" id="invForm"><div class="field"><label>Date</label><input name="date" type="date" value="${today()}" required></div><div class="field"><label>Investor</label><select name="investor">${investorOpts()}</select></div><div class="field"><label>Stock / ETF</label><input name="stock" placeholder="RELIANCE" required></div><div class="field"><label>Type</label><select name="type"><option>BUY</option><option>SELL</option></select></div><div class="field"><label>Quantity</label><input name="qty" type="number" step="0.0001" min="0" required></div><div class="field"><label>Price / share</label><input name="price" type="number" step="0.01" min="0"></div><div class="field"><label>Amount (₹)</label><input name="amount" type="number" step="0.01" min="0" required></div><div class="field"><label>Current price (₹)</label><input name="current" type="number" step="0.01" min="0"></div><div class="field full"><label>Notes</label><textarea name="notes" rows="2" placeholder="Investment thesis, reason for purchase, target, etc."></textarea></div><div class="full"><button class="btn primary">Add transaction</button></div></form></div>`;invForm.onsubmit=e=>{e.preventDefault();let f=new FormData(invForm),x=Object.fromEntries(f);x.qty=+x.qty;x.price=+x.price||0;x.amount=+x.amount;x.current=+x.current||x.price;x.pl=x.type==='SELL'?(x.current-x.price)*x.qty:0;data.tx.push(x);save();show('holdings')}}
function renderHoldings(){let q=window.hq||'';holdings.innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px"><div class="section-title" style="margin:0">All transactions</div><input id="search" class="select" placeholder="Search stock or investor" value="${esc(q)}"></div><div class="tablewrap"><table class="table"><thead><tr><th>Date</th><th>Investor</th><th>Stock</th><th>Type</th><th>Qty</th><th>Amount</th><th>Value</th><th>P/L</th><th></th></tr></thead><tbody>${data.tx.slice().reverse().filter(x=>(x.stock+' '+x.investor).toLowerCase().includes(q.toLowerCase())).map((x,i)=>`<tr><td>${x.date}</td><td>${esc(x.investor)}</td><td><b>${esc(x.stock)}</b></td><td><span class="pill">${x.type}</span></td><td>${(+x.qty).toFixed(4)}</td><td>${money(x.amount)}</td><td>${money(x.qty*x.current)}</td><td class="${x.pl>=0?'green':'red'}">${money(x.pl)}</td><td><button class="btn" data-del="${data.tx.indexOf(x)}">Delete</button></td></tr>`).join('')||'<tr><td colspan="9" class="empty">No transactions found.</td></tr>'}</tbody></table></div></div>`;search.oninput=()=>{window.hq=search.value;renderHoldings()}}
function renderWeekly(){weekly.innerHTML=`<div class="card"><div class="section-title">Weekly activity</div><form class="form" id="weekForm"><div class="field"><label>Week ending</label><input name="date" type="date" value="${today()}" required></div><div class="field"><label>Investor</label><select name="investor">${investorOpts()}</select></div><div class="field"><label>Activity</label><select name="activity"><option>Buy</option><option>Sell</option><option>Hold</option><option>Dividend received</option><option>Rebalanced</option><option>Research / Watchlist</option><option>Other</option></select></div><div class="field"><label>Stock</label><input name="stock" placeholder="TCS"></div><div class="field"><label>Amount (₹)</label><input name="amount" type="number" min="0" step="0.01"></div><div class="field"><label>Weekly P/L (₹)</label><input name="pl" type="number" step="0.01"></div><div class="field full"><label>Notes</label><textarea name="notes" rows="2" placeholder="What did you do this week?"></textarea></div><div class="full"><button class="btn primary">Add weekly record</button></div></form></div><div class="card" style="margin-top:16px"><div class="tablewrap"><table class="table"><thead><tr><th>Week</th><th>Investor</th><th>Activity</th><th>Stock</th><th>Amount</th><th>P/L</th><th>Notes</th><th></th></tr></thead><tbody>${data.weeks.slice().reverse().map(x=>`<tr><td>${x.date}</td><td>${esc(x.investor)}</td><td>${esc(x.activity)}</td><td>${esc(x.stock)}</td><td>${money(x.amount)}</td><td class="${x.pl>=0?'green':'red'}">${money(x.pl)}</td><td>${esc(x.notes)}</td><td><button class="btn" data-dw="${data.weeks.indexOf(x)}">Delete</button></td></tr>`).join('')||'<tr><td colspan="8" class="empty">No weekly records yet.</td></tr>'}</tbody></table></div></div>`;weekForm.onsubmit=e=>{e.preventDefault();let x=Object.fromEntries(new FormData(weekForm));x.amount=+x.amount||0;x.pl=+x.pl||0;data.weeks.push(x);save();renderWeekly()}}
function renderStatements(){let inv=window.si||data.investors[0];let s=stats(inv);let stocks={};s.tx.filter(x=>x.type==='BUY').forEach(x=>{stocks[x.stock]=(stocks[x.stock]||0)+x.qty*x.current});statements.innerHTML=`<div class="card"><div class="statement-head"><div><div class="section-title" style="margin:0 0 4px">Investor statement</div><div class="sub">Individual portfolio, transaction and weekly performance summary.</div></div><select id="statementSelect" class="select">${investorOpts()}</select></div><div class="cards"><div class="card"><div class="label">Invested</div><div class="value">${money(s.invested)}</div></div><div class="card"><div class="label">Current value</div><div class="value">${money(s.value)}</div></div><div class="card"><div class="label">P/L</div><div class="value ${s.pl>=0?'green':'red'}">${money(s.pl)}</div><div class="sub">${(s.invested?s.pl/s.invested*100:0).toFixed(2)}% return</div></div><div class="card"><div class="label">Transactions</div><div class="value">${s.tx.length}</div></div></div></div><div class="grid2"><div class="card"><div class="section-title">Current holdings</div>${Object.entries(stocks).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="barrow"><div class="barlabel"><span><b>${esc(k)}</b></span><b>${money(v)}</b></div><div class="bar"><i style="width:${s.value?v/s.value*100:0}%"></i></div></div>`).join('')||'<div class="empty">No holdings for this investor.</div>'}</div><div class="card"><div class="section-title">Weekly P/L</div>${data.weeks.filter(x=>x.investor===inv).slice().reverse().slice(0,12).map(x=>`<div class="barlabel" style="padding:9px 0;border-bottom:1px solid var(--line)"><span>${x.date} · ${esc(x.activity)}</span><b class="${x.pl>=0?'green':'red'}">${money(x.pl)}</b></div>`).join('')||'<div class="empty">No weekly records.</div>'}</div></div><div class="card" style="margin-top:16px"><div class="section-title">Transaction history</div><div class="tablewrap"><table class="table"><thead><tr><th>Date</th><th>Stock</th><th>Type</th><th>Qty</th><th>Amount</th><th>Value</th><th>P/L</th></tr></thead><tbody>${s.tx.slice().reverse().map(x=>`<tr><td>${x.date}</td><td><b>${esc(x.stock)}</b></td><td>${x.type}</td><td>${(+x.qty).toFixed(4)}</td><td>${money(x.amount)}</td><td>${money(x.qty*x.current)}</td><td class="${x.pl>=0?'green':'red'}">${money(x.pl)}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">No transactions.</td></tr>'}</tbody></table></div></div>`;statementSelect.value=inv;statementSelect.onchange=()=>{window.si=statementSelect.value;renderStatements()}}
function renderInvestors(){investors.innerHTML=`<div class="card"><div class="section-title">Manage investors</div><form id="invtorForm" style="display:flex;gap:8px;max-width:520px"><input id="newInvestor" class="select" style="flex:1" placeholder="Investor name" required><button class="btn primary">Add investor</button></form><div style="margin-top:16px">${data.investors.map((x,i)=>`<div style="display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)"><span>${esc(x)}</span><button class="btn" data-di="${i}" ${data.investors.length<=1?'disabled':''}>Remove</button></div>`).join('')}</div></div>`;invtorForm.onsubmit=e=>{e.preventDefault();let n=newInvestor.value.trim();if(n&&!data.investors.includes(n)){data.investors.push(n);save();render()}}}
document.addEventListener('click',e=>{if(e.target.dataset.del){data.tx.splice(+e.target.dataset.del,1);save();render()}if(e.target.dataset.dw){data.weeks.splice(+e.target.dataset.dw,1);save();render()}if(e.target.dataset.di){data.investors.splice(+e.target.dataset.di,1);save();render()}});
document.getElementById('export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='investtrack-backup.json';a.click()};
document.getElementById('import').onclick=()=>document.getElementById('file').click();document.getElementById('file').onchange=e=>{let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(d.investors&&d.tx&&d.weeks){data=d;save();render()}}catch(_){alert('Invalid backup file')}};r.readAsText(e.target.files[0])};
render();
</script>
</body>
</html>
